{% extends "base.html" %}

{% block title %}
{{ service.title }}
{% endblock %}

{% block content %}

<section class="py-16 md:py-24 bg-slate-50">

    <div class="max-w-5xl mx-auto px-6">

        <!-- Breadcrumb -->
        <div class="mb-8 text-sm text-slate-500">

            <a
                href="{% url 'home' %}"
                class="hover:text-indigo-600 transition"
            >
                صفحه اصلی
            </a>

            <span class="mx-2">/</span>

            <span class="text-slate-700">
                {{ service.title }}
            </span>

        </div>


        <!-- Main Card -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">

            <div class="p-8 md:p-12">

                <!-- Icon -->
                <div class="w-20 h-20 flex items-center justify-center rounded-2xl bg-indigo-50 text-4xl mb-6">
                    {{ service.icon }}
                </div>


                <!-- Title -->
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900">
                    {{ service.title }}
                </h1>


                <!-- Description -->
                <p class="mt-6 max-w-3xl text-lg leading-9 text-slate-600">
                    {{ service.description }}
                </p>


                <!-- Action -->
                <div class="mt-10">

                    <button
                        type="button"
                        class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-7 py-3.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 transition"
                    >
                        شروع درخواست
                    </button>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
