        {{ icon }}

    <h3 class="text-lg font-bold text-slate-800 mb-2">
        {{ title }}
    </h3>

    <p class="text-sm text-slate-500 leading-7">

    <a href="{% url 'service_detail' service_slug %}" class="inline-flex items-center gap-2 mt-5 text-sm font-semibold text-indigo-500 group-hover:text-indigo-700">
